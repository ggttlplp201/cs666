[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cs2-quant"
version = "0.1.0"
description = "CS2 skin trading agents on BUFF163 — System A (event-driven), System B (positional) + shared infrastructure"
requires-python = ">=3.12"
dependencies = [
    "pyyaml",
    # System B (shared_b) stack:
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
]

[project.optional-dependencies]
ml = ["xgboost"]
plot = ["matplotlib"]
dev = ["pytest"]
dashboard = ["streamlit"]   # read-only research dashboard (make dashboard)
monitor = ["scrapling[fetchers]"]   # live news/announcement scraping (optional;
                                    # monitor degrades gracefully without it)

[tool.setuptools.packages.find]
# Two self-contained systems, one per top-level folder (see README "Layout").
where = ["system_a/src", "system_b/src"]

[tool.pytest.ini_options]
# Running pytest at the root exercises both suites; `cd system_a && pytest`
# (or system_b) runs one system alone via that folder's conftest.py.
# Package names don't collide: A owns `shared`/`system_a`, B owns
# `shared_b`/`system_b`.
pythonpath = ["system_a/src", "system_b/src"]
testpaths = ["system_a/tests", "system_b/tests"]
